[nodes.P_hard_pairs]
fingerprint = "sha256:374a37d7b3ac"
kind = "lemma"
statement = "Let \\(H:[0,1]\\to[0,1]\\) be continuous and nonincreasing, with \\(H(1)=\\eta>0\\), and let \\(d>0\\). Extend \\(H\\) to a buyer survival function by keeping it equal to \\(\\eta\\) on \\([1,R_\\eta)\\), where \\(R_\\eta=1+d/\\eta\\), and setting it to zero at and above \\(R_\\eta\\). Include an atom of size \\(1-H(0)\\) at zero if needed. Define\n\\begin{equation}\nL(s)=d+\\int_s^1H(u)\\,\\mathrm du,\\qquad\nT(s)=\\int_0^sL(u)^{-2}\\,\\mathrm du,\n\\qquad\nF_s(s)=d\\bigl(L(s)^{-1}-H(s)T(s)\\bigr)\\quad(0\\le s<1),\n\\label{eq:39}\n\\end{equation}\nand complete \\(F_s\\) with an atom at one. This is a valid seller CDF. With\n\\(T_\\eta=T(1)\\) and \\(J_\\eta=\\mathcal J_d(H(1-\\cdot))\\), the pair satisfies\n\\begin{equation}\nM_\\eta=1-d^2T_\\eta,\\qquad\n\\Gamma_{\\max,\\eta}=d+\\eta d^2T_\\eta,\\qquad\nG_\\eta=d+dJ_\\eta-d^3T_\\eta.\n\\label{eq:40}\n\\end{equation}\nIn particular, for every \\(\\beta\\),\n\\begin{equation}\n\\Gamma_{\\max,\\eta}-\\beta G_\\eta+\\beta dM_\\eta\n=d(1-\\beta J_\\eta)+\\eta d^2T_\\eta.\n\\label{eq:41}\n\\end{equation}"
depends_on = ["A_model"]
verified = ["rethlas"]
notes = "Rethlas\\verification\\results\\fpm_20260913_P_hard_pairs_context\\verification.json; verifier /root/audit_hard_pairs; Independent LLM proof audit, not formal verification. Agent /root/audit_hard_pairs; manuscript sha256 46124c72f1f3d71deaebfd4e5e22cc87e76c5638ac963c074675bee90fa8b42c; blueprint sha256 7331ebe164fdbd17a26409736d219159227312a3980b1020099cf1bb8243d407; premise set ['A_model']. Source-context extraction correction only; statement, blueprint and manuscript unchanged. Original report retained: Rethlas\\verification\\results\\fpm_20260913_P_hard_pairs\\verification.json. Added source context: Rethlas\\reasoning\\data\\fixed_price_manuscript_20260913\\P_hard_pairs.refs\\source_context.md sha256 226d416bbf24a8798d6ba663fd6046e8d8af321cd7141f540959e5c9962147af. Pass artifact: Rethlas\\reasoning\\results\\fixed_price_manuscript_20260913\\P_hard_pairs\\blueprint_verified.md."

