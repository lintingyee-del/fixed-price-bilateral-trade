[nodes.A_two_model]
kind = "assumption"
statement = "\\section{Two units}\\label{sec:two}\n\n\\subsection{Model and separation}\\label{sec:two-model}\n\nWe use the increasing submodular model of \\cite{ggkls19,gdk26}.\nThe seller owns two units. The buyer's marginal values and the seller's\nmarginal costs of relinquishing successive units satisfy\n\\(B_1\\ge B_2>0\\) and \\(0<S_1\\le S_2\\).\nThe two vectors are independent, with finite first moments;\ntheir coordinates may be dependent. A common price \\(z\\) trades successive\nunits while both agents accept, using the inclusive convention of\nSection~\\ref{sec:model}. Since the accepting units form an initial segment,\n\\begin{equation}\\label{eq:two-model}\n\\begin{aligned}\nM_2&=\\mathbb E(S_1+S_2),&\nO_2&=\\sum_{i=1}^2\\mathbb E\\max\\{B_i,S_i\\},\\\\\n\\Gamma_2(z)&=\\sum_{i=1}^2\\mathbb E[(B_i-S_i)\n                       \\mathbf1_{\\{S_i\\le z\\le B_i\\}}],&\nr_2^*&=\\inf\\frac{M_2+\\sup_{z\\ge0}\\Gamma_2(z)}{O_2}.\n\\end{aligned}\n\\end{equation}\nThe symmetric subclass requires \\((B_1,B_2)\\) and \\((S_2,S_1)\\)\nto have the same law, so the valuation functions are identically distributed.\nWe denote its infimum by \\(r_{2,\\mathrm{sym}}^*\\)."
depends_on = []
verified = []
location = "two_units.tex, sec:two-model"
notes = ""

[nodes.D_two_bodies]
kind = "definition"
statement = "\\label{sec:two-tail}\n\nLet \\(Z=(Z_1,Z_2)\\) and \\(Y=(Y_1,Y_2)\\) be independent bounded\nnonnegative vectors with \\(Z_1\\ge Z_2\\) and \\(Y_1\\le Y_2\\). Define\n\\begin{equation}\\label{eq:two-body}\n\\begin{aligned}\n\\Gamma_0(z)&=\\sum_{i=1}^2\\mathbb E\\!\\left[\n \\mathbf1_{\\{Y_i<z\\}}\n \\left(1+(Z_i-Y_i)\\mathbf1_{\\{z\\le Z_i\\}}\\right)\\right],\\\\\n\\mathcal R_2(Z,Y)&=\n \\frac{2+\\mathbb E(Y_1+Y_2)}\n {2+\\sum_{i=1}^2\\mathbb E\\max\\{Z_i,Y_i\\}}.\n\\end{aligned}\n\\end{equation}\nThe constant \\(1\\) in each gain term is the limiting first moment\nof a common escaping buyer atom. The normalized model uses strict\nseller acceptance and inclusive buyer acceptance, as induced by a\npositive seller displacement before taking the limit.\nWe call \\((Z,Y)\\) \\emph{admissible bodies} if \\(\\Gamma_0(z)\\le2\\)\nfor every price. Above the bodies, \\(\\Gamma_0(z)=2\\)."
depends_on = ["A_two_model"]
verified = []
location = "two_units.tex, eq:two-body"
notes = ""

[nodes.D_two_pricing]
kind = "definition"
statement = "\\label{sec:two-pricing}\n\nWe fix buyer bodies \\(Z_1\\ge_{\\mathrm{st}}Z_2\\) supported on\n\\([0,\\bar b]\\), and write \\(H_i(s)=\\Pr(Z_i>s)\\).\nFor seller bodies we use \\(F_i(s)=\\Pr(Y_i\\le s)\\). The associated buyer Stieltjes measures are \\(-\\mathrm dH_i\\).\nFor \\(s,z\\ge0\\), define\n\\begin{equation}\\label{eq:two-kernel}\n\\begin{aligned}\n\\bar L_i(s)&=1+\\mathbb E(Z_i-s)_+,\\\\\ng_i(s,z)&=\\mathbf1_{\\{s<z\\}}\n \\left[1+\\mathbb E\\bigl((Z_i-s)\\mathbf1_{\\{z\\le Z_i\\}}\\bigr)\\right].\n\\end{aligned}\n\\end{equation}\nThus \\(s+\\bar L_i(s)=1+\\mathbb E\\max\\{Z_i,s\\}\\) is normalized\nefficient welfare. A price measure \\(\\pi\\) gives conditional gain\n\\(\\int g_i(s,z)\\,\\pi(\\mathrm dz)\\).\nWe minimize nonnegative price mass; any unused probability is placed at zero.\n\nFix \\(d>0\\). A normalized price has a body measure\n\\(\\widehat\\pi_0\\) on \\((0,\\bar b]\\), an ideal tail mass, and cumulative mass\n\\[\n\\varpi(s)=\\varpi(\\bar b)+\\widehat\\pi_0((s,\\bar b]).\n\\]\nIt is nonnegative, nonincreasing, and right-continuous.\nThe ideal tail contributes one unit of gain per unit of mass to sellers\nin \\([0,\\bar b]\\). The gain and seller potentials are\n\\begin{equation}\\label{eq:two-potential}\n\\begin{aligned}\nG_i^\\varpi(s)&=\\bar L_i(s)\\varpi(s)\n -\\int_{(s,\\bar b]}(t-s)\\varpi(t)\\,(-\\mathrm dH_i(t)),\\\\\n\\psi_i^\\varpi(s)&=ds-\\bar L_i(s)+G_i^\\varpi(s).\n\\end{aligned}\n\\end{equation}\nThe atom at \\(s\\) is excluded from \\(\\varpi(s)\\).\nThis trace convention retains a buyer atom at its posted price.\n\nLet \\(\\mathcal V\\) consist of bounded, nondecreasing, right-continuous\ncompensations \\(\\vartheta:[0,\\bar b]\\to\\mathbb R\\).\nThe inequalities\n\\(\\psi_1^\\varpi\\ge-\\vartheta\\), \\(\\psi_2^\\varpi\\ge\\vartheta\\)\nensure a nonnegative potential sum on all \\(s_1\\le s_2\\).\nConversely, such nonnegativity permits the canonical compensation\n\\(\\Theta_\\varpi(s)=-\\inf_{t\\le s}\\psi_1^\\varpi(t)\\).\nSet \\(\\epsilon_1=-1,\\epsilon_2=1\\), and define\n\\begin{equation}\\label{eq:two-operator}\n\\begin{aligned}\n(\\mathcal T_{d,\\vartheta}\\varpi)(s)\n &=\\sup_{s\\le t\\le\\bar b}\n \\max\\{0,\\mathcal A_{1,d,\\vartheta}\\varpi(t),\n           \\mathcal A_{2,d,\\vartheta}\\varpi(t)\\},\\\\\n\\mathcal A_{i,d,\\vartheta}\\varpi(t)\n &=1-\\frac{dt}{\\bar L_i(t)}\n +\\frac{\\epsilon_i\\vartheta(t)}{\\bar L_i(t)}\n +\\frac{\\int_{(t,\\bar b]}(v-t)\\varpi(v)\\,(-\\mathrm dH_i(v))}\n        {\\bar L_i(t)}.\n\\end{aligned}\n\\end{equation}\nThe future supremum enforces cumulative-price monotonicity; the\ncompensation's monotonicity encodes seller order.\nThe operator acts on bounded Borel functions."
depends_on = ["D_two_bodies"]
verified = []
location = "two_units.tex, eq:two-kernel through eq:two-operator"
notes = ""

[nodes.D_two_family]
kind = "definition"
statement = "\\label{sec:two-candidate}\n\nAll quantities carrying the subscript $\\mathrm f$ belong to the family\ndefined here. We use $t_{\\mathrm f}$ and $p_{\\mathrm f}$ for its scalar parameters,\n$\\xi$ for its curve coordinate, and $\\mathcal P$ for its reciprocal state.\nThey are distinct from the single-unit coordinates in the main text.\nFor $0<t_{\\mathrm f}<1$, $t_{\\mathrm f}\\le p_{\\mathrm f}\\le1$, and $\\xi_0>0$, define\n\\begin{gather}\n m_{\\mathrm f}=\\frac{2t_{\\mathrm f}}{1+t_{\\mathrm f}},\\qquad\n D_{\\mathrm f}=\\frac2{1+t_{\\mathrm f}},\\qquad\n c_{\\mathrm f}=\\frac{p_{\\mathrm f}-t_{\\mathrm f}}{2},\\qquad\n \\delta_{\\mathrm f}=\\frac{p_{\\mathrm f}+t_{\\mathrm f}}{2},\\notag\\\\\n e_{\\mathrm f}=\\frac{1+t_{\\mathrm f}}{2},\\qquad\n v_{\\mathrm f}=1-e_{\\mathrm f},\\qquad\n a_{\\mathrm f}=\\frac{c_{\\mathrm f}}{t_{\\mathrm f}p_{\\mathrm f}},\\qquad\n h_{\\mathrm f}=\\frac{v_{\\mathrm f}}{\\xi_0}.\n \\label{eq:2fam-parameters}\n\\end{gather}\nWe require $\\xi_0\\ge c_{\\mathrm f}$.\nThe closed curve class $\\mathfrak F$ consists of positive,\nconcave Lipschitz functions on $[c_{\\mathrm f},\\xi_0]$ satisfying\n\\begin{equation}\n \\mathcal P(c_{\\mathrm f})=p_{\\mathrm f},\\qquad\n \\mathcal P(\\xi_0)=1,\\qquad\n \\mathcal P(\\xi)\\le U_{\\mathrm f}(\\xi)\n :=\\min\\{\\xi+\\delta_{\\mathrm f},h_{\\mathrm f}\\xi+e_{\\mathrm f}\\}.\n \\label{eq:2fam-class}\n\\end{equation}\nFor a nondegenerate interval, concavity and the two endpoint obstacles\nimply $h_{\\mathrm f}\\le\\mathcal P'\\le1$ almost everywhere.\nThe case $p_{\\mathrm f}=1$ is included as a degenerate interval by continuity.\nWe distinguish the subclass whose endpoint slopes are $1$ and\n$h_{\\mathrm f}$; the closed class also admits endpoint atoms and corners.\nIts functionals are\n\\begin{align}\n T_{\\mathrm f}&=\\int_{c_{\\mathrm f}}^{\\xi_0}\\mathcal P^{-2}\\,d\\xi,\n &Q_{\\mathrm f}&=\\int_{c_{\\mathrm f}}^{\\xi_0}\n          \\xi(\\mathcal P'/\\mathcal P)^2\\,d\\xi,\\notag\\\\\n M_{\\mathrm f}&=D_{\\mathrm f}(a_{\\mathrm f}+T_{\\mathrm f}-\\xi_0),\n &G_{\\mathrm f}&=2+2m_{\\mathrm f}a_{\\mathrm f}\n       -D_{\\mathrm f}\\log p_{\\mathrm f}-D_{\\mathrm f}Q_{\\mathrm f},\\notag\\\\\n R_{\\mathrm f}&=\\frac{M_{\\mathrm f}+2}{M_{\\mathrm f}+G_{\\mathrm f}}.\n &&\\label{eq:2fam-functionals}\n\\end{align}\n\n\n\nFor a trial ratio $0<\\beta_{\\mathrm f}<1$, define\n$d_{\\mathrm f}=(1-\\beta_{\\mathrm f})/\\beta_{\\mathrm f}$ and\n\\begin{align}\n E_{\\mathrm f}(\\mathcal P)\n   &=\\int_{c_{\\mathrm f}}^{\\xi_0}\n       \\{\\xi(\\log\\mathcal P)'^2+d_{\\mathrm f}\\mathcal P^{-2}\\}\n       \\,d\\xi,\\notag\\\\\n K_{\\mathrm f}(\\mathcal P)\n   &=\\frac{\\beta_{\\mathrm f}G_{\\mathrm f}\n         -(1-\\beta_{\\mathrm f})M_{\\mathrm f}-2}\n          {\\beta_{\\mathrm f}D_{\\mathrm f}}\\notag\\\\\n   &=1-\\frac{t_{\\mathrm f}}{p_{\\mathrm f}}-\\log p_{\\mathrm f}\n       -d_{\\mathrm f}a_{\\mathrm f}\n       -d_{\\mathrm f}(1+t_{\\mathrm f})\n       +d_{\\mathrm f}\\xi_0-E_{\\mathrm f}(\\mathcal P).\n \\label{eq:2fam-comparison}\n\\end{align}\nThus $R_{\\mathrm f}<\\beta_{\\mathrm f}$ exactly when $K_{\\mathrm f}>0$.\nThe normalization by $D_{\\mathrm f}$ depends on $t_{\\mathrm f}$; all outer\nderivatives below are derivatives of $K_{\\mathrm f}$."
depends_on = ["D_two_bodies"]
verified = []
location = "two_units.tex, eq:2fam-parameters through eq:2fam-functionals; two_unit_family.tex, eq:2fam-comparison"
notes = ""

[nodes.D_two_stationary]
kind = "definition"
statement = "Write $\\xi_\\ell<\\xi_r$ for the contact times,\n$\\mathcal P_\\ell=\\xi_\\ell+\\delta_{\\mathrm f}$,\n$\\mathcal P_r=h_{\\mathrm f}\\xi_r+e_{\\mathrm f}$, and\n$Y_{\\mathrm f}=\\log(\\xi_r/\\xi_\\ell)$.\nDefine the two dimensionless contact slopes\n$q_{\\ell,\\mathrm f}=\\xi_\\ell/\\mathcal P_\\ell$ and\n$q_{r,\\mathrm f}=h_{\\mathrm f}\\xi_r/\\mathcal P_r$.\nIntegration of \\eqref{eq:2fam-euler} gives\n\\begin{align}\n T_{\\mathrm f}&=p_{\\mathrm f}^{-1}-\\mathcal P_\\ell^{-1}\n      +(q_{\\ell,\\mathrm f}-q_{r,\\mathrm f})/d_{\\mathrm f}\n      +(\\mathcal P_r^{-1}-1)/h_{\\mathrm f},\\notag\\\\\n Q_{\\mathrm f}&=-\\log p_{\\mathrm f}-C_{\\mathrm f}Y_{\\mathrm f}\n                    -\\delta_{\\mathrm f}/p_{\\mathrm f}+e_{\\mathrm f},\\notag\\\\\n G_{\\mathrm f}&=3-m_{\\mathrm f}+m_{\\mathrm f}a_{\\mathrm f}\n                       +D_{\\mathrm f}C_{\\mathrm f}Y_{\\mathrm f}.\n \\label{eq:2fam-quadratures}\n\\end{align}\nThe three outer equations are\n\\begin{equation}\n\\begin{aligned}\n 0=2\\partial_{p_{\\mathrm f}}K_{\\mathrm f}\n   &=\\frac{t_{\\mathrm f}+d_{\\mathrm f}}{p_{\\mathrm f}^2}\n        -\\frac{\\delta_{\\mathrm f}+d_{\\mathrm f}}{\\mathcal P_\\ell^2},\\\\\n 0=\\partial_{h_{\\mathrm f}}K_{\\mathrm f}\n   &=-\\xi_0^2h_{\\mathrm f}\n     +\\frac{2(h_{\\mathrm f}e_{\\mathrm f}+d_{\\mathrm f})}{h_{\\mathrm f}^2}\n       \\left\\{\\mathcal P_r^{-1}-1\n          +\\frac{e_{\\mathrm f}}2(1-\\mathcal P_r^{-2})\\right\\},\\\\\n 0=\\partial_{t_{\\mathrm f}}K_{\\mathrm f}\n   &=-\\frac1{2p_{\\mathrm f}}+\\frac{d_{\\mathrm f}}{2t_{\\mathrm f}^2}\n      -d_{\\mathrm f}\n      -\\frac{\\delta_{\\mathrm f}+d_{\\mathrm f}}{2\\mathcal P_\\ell^2}\n      -\\frac{\\xi_0h_{\\mathrm f}}2\n      +\\frac{h_{\\mathrm f}e_{\\mathrm f}+d_{\\mathrm f}}{2h_{\\mathrm f}}\n         (\\mathcal P_r^{-2}-1).\n\\end{aligned}\\label{eq:2fam-stationarity}\n\\end{equation}\n\n\\subsection{The stationary branch and the family minimum}\n\nWe eliminate the contact parameters using\n\\eqref{eq:2fam-stationarity}. Define\n\\begin{gather}\n \\mathcal P_\\ell=p_{\\mathrm f}\n       \\sqrt{\\frac{\\delta_{\\mathrm f}+d_{\\mathrm f}}\n                    {t_{\\mathrm f}+d_{\\mathrm f}}},\\qquad\n \\xi_\\ell=\\mathcal P_\\ell-\\delta_{\\mathrm f},\\qquad\n C_{\\mathrm f}\n       =\\frac{(\\delta_{\\mathrm f}+d_{\\mathrm f})\\xi_\\ell}\n                    {\\mathcal P_\\ell^2},\\notag\\\\\n v_{\\mathrm f}^2(q_{r,\\mathrm f}^2-q_{r,\\mathrm f}+C_{\\mathrm f})\n       =C_{\\mathrm f}q_{r,\\mathrm f}^2,\\qquad 0<q_{r,\\mathrm f}<v_{\\mathrm f},\n \\notag\\\\\n A_{\\mathrm f}=-d_{\\mathrm f}/t_{\\mathrm f}^2+2d_{\\mathrm f}\n          +1/p_{\\mathrm f}+(t_{\\mathrm f}+d_{\\mathrm f})/p_{\\mathrm f}^2,\\qquad\n \\mathcal A_{\\mathrm f}(t_{\\mathrm f},p_{\\mathrm f})\n       =-A_{\\mathrm f}\n        +\\frac{v_{\\mathrm f}(v_{\\mathrm f}-q_{r,\\mathrm f})}\n               {e_{\\mathrm f}(v_{\\mathrm f}+q_{r,\\mathrm f})}=0.\n \\label{eq:2fam-algebraic}\n\\end{gather}\nThe equation for $q_{r,\\mathrm f}$ has one root in $(0,v_{\\mathrm f})$,\nbecause $v_{\\mathrm f}^2q_{r,\\mathrm f}(1-q_{r,\\mathrm f})/\n(v_{\\mathrm f}^2-q_{r,\\mathrm f}^2)$ increases from zero to infinity.\nWith $\\mathcal D_{\\mathrm f}(u)=u^2-u+C_{\\mathrm f}$, define\n\\begin{gather}\n J_{\\mathrm f}=\\int_{q_{r,\\mathrm f}}^{q_{\\ell,\\mathrm f}}\n          \\frac{du}{\\mathcal D_{\\mathrm f}(u)},\\notag\\\\\n \\mathcal F_{\\mathrm f}(t_{\\mathrm f},p_{\\mathrm f})\n =\\log\\frac{1-q_{r,\\mathrm f}}{1-q_{\\ell,\\mathrm f}}\n    +\\frac12\\log\\frac{\\mathcal D_{\\mathrm f}(q_{\\ell,\\mathrm f})}\n                         {\\mathcal D_{\\mathrm f}(q_{r,\\mathrm f})}\n    +\\frac{J_{\\mathrm f}}2-\\log\\frac{e_{\\mathrm f}}{\\delta_{\\mathrm f}}=0.\n \\label{eq:2fam-connection}\n\\end{gather}\nThe recovered parameters are\n\\begin{equation}\n h_{\\mathrm f}\n   =\\frac{d_{\\mathrm f}q_{r,\\mathrm f}(1-q_{r,\\mathrm f})}\n               {e_{\\mathrm f}\\mathcal D_{\\mathrm f}(q_{r,\\mathrm f})},\\qquad\n \\mathcal P_r=\\frac{e_{\\mathrm f}}{1-q_{r,\\mathrm f}},\\qquad\n \\xi_r=\\frac{q_{r,\\mathrm f}\\mathcal P_r}{h_{\\mathrm f}},\\qquad\n \\xi_0=\\frac{v_{\\mathrm f}}{h_{\\mathrm f}}.\n \\label{eq:2fam-recovery}\n\\end{equation}\nA physical stationary point means that these formulas produce a curve\nin \\eqref{eq:2fam-class}, with\n$c_{\\mathrm f}<\\xi_\\ell<\\xi_r<\\xi_0$,\n$0<q_{r,\\mathrm f}<q_{\\ell,\\mathrm f}<1$, and positive\n$\\mathcal D_{\\mathrm f}$ on the integration interval."
depends_on = ["D_two_family"]
verified = []
location = "two_unit_family.tex, eq:2fam-quadratures through eq:2fam-recovery"
notes = "These formulas define the reduced stationary system. Its characterization of extrema is established through the boundary and shape lemmas, not assumed as an independent theorem."

