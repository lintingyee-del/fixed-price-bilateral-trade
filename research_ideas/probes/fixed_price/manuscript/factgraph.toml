[nodes.T_exact]
fingerprint = "sha256:cdd22977edf5"
kind = "theorem"
statement = "Let \\(V_s,V_b\\) be independent nonnegative values with \\(0<\\mathbb E\\max\\{V_s,V_b\\}<\\infty\\). A fixed price trades when \\(V_s\\le z\\le V_b\\). Its optimal universal welfare guarantee is\n\\[\n\\inf_{F_s,F_b}\\max_{z\\ge0}\n\\frac{\\mathbb EV_s+\\mathbb E[(V_b-V_s)\\mathbf1_{\\{V_s\\le z\\le V_b\\}}]}\n{\\mathbb E\\max\\{V_s,V_b\\}}\n=\\beta_*=0.7380243357344945\\ldots.\n\\]\nThe constant is \\(\\beta_*=[C_*(2+\\mathcal I(C_*))]^{-1}\\), where \\(C_*\\) is the unique root in \\((1/4,1/2)\\) of\n\\begin{equation}\n\\begin{aligned}\nC(2+\\mathcal I(C))&=1+\\frac{C^2}{1-2C}e^{-\\mathcal I(C)/2},\\\\\n\\mathcal I(C)&=\\frac{1}{\\sqrt{C-1/4}}\n\\left[\\arctan\\frac{1-3C}{2(1-C)\\sqrt{C-1/4}}\n+\\arctan\\frac{1}{2\\sqrt{C-1/4}}\\right].\n\\end{aligned}\n\\label{eq:rootintro}\n\\end{equation}\nEvery pair has ratio strictly greater than \\(\\beta_*\\). For every \\(\\varepsilon>0\\), the explicit bounded family in Lemma~\\ref{lem:hard} contains a pair with ratio below \\(\\beta_*+\\varepsilon\\)."
depends_on = ["A_model", "P_preliminaries", "T_calibration", "P_pricing", "P_hard_pairs"]
verified = ["rethlas"]
notes = "Rethlas\\verification\\results\\fpm_20260913_T_exact\\verification.json; verifier /root/audit_exact; Independent LLM proof audit, not formal verification. Agent /root/audit_exact; manuscript sha256 46124c72f1f3d71deaebfd4e5e22cc87e76c5638ac963c074675bee90fa8b42c; blueprint sha256 60ee22da3cc6fb8a6836e2be605f63b1403f409f3a30a22cdc3fdcc98be81711; premise set ['A_model', 'P_preliminaries', 'T_calibration', 'P_pricing', 'P_hard_pairs']. Supplied original source context: {\"Rethlas\\\\reasoning\\\\data\\\\fixed_price_manuscript_20260913\\\\T_exact.refs\\\\source_context.md\": \"226d416bbf24a8798d6ba663fd6046e8d8af321cd7141f540959e5c9962147af\"}. Pass artifact: Rethlas\\reasoning\\results\\fixed_price_manuscript_20260913\\T_exact\\blueprint_verified.md."

[nodes.T_frontier]
fingerprint = "sha256:8906eb48ccb1"
kind = "theorem"
statement = "\\begin{theoremB}[Sharp affine and conditional GFT guarantees]\\label{thm:frontier}\nThe scalar curve \\eqref{eq:4} gives the entire frontier:\n\\begin{equation}\n\\beta(C)=\\frac1{S(C)},\\qquad\n\\delta(\\beta(C))=\\frac{\\tau(C)}{S(C)},\n\\qquad \\frac14<C<\\frac12.\n\\label{eq:47}\n\\end{equation}\nEvery coefficient smaller than \\(\\delta(\\beta)\\) is refuted by a bounded hard pair of independent distributions.\n\nThe function \\(\\delta\\) is strictly increasing and strictly convex on \\((0,1)\\). Its derivative ranges from zero to infinity.\n\nWith \\(u=1-2C\\), the map\n\\begin{equation}\n\\kappa(C)=\\frac{\\tau(C)(S(C)+u)}u\n\\label{eq:51}\n\\end{equation}\nis a strictly increasing bijection from \\((1/4,1/2)\\) onto \\((0,\\infty)\\), and\n\\begin{equation}\n\\rho(\\kappa(C))\n=\\frac1{S(C)+u}\n=\\frac1{1+C\\mathcal I(C)}.\n\\label{eq:52}\n\\end{equation}\nEquivalently, extending \\(\\delta\\) by \\(+\\infty\\) outside \\((0,1)\\) for the purpose of conjugation,\n\\begin{equation}\n\\kappa\\rho(\\kappa)=\\delta^*(\\kappa)\n:=\\sup_{0<\\beta<1}\\{\\kappa\\beta-\\delta(\\beta)\\}.\n\\label{eq:53}\n\\end{equation}\nFor each fixed \\(\\kappa\\), bounded hard pairs with exactly \\(G/M=\\kappa\\) approach \\eqref{eq:52}.\n\n\\end{theoremB}\n\n\\begin{corollaryB}[Endpoint asymptotics]\\label{cor:asymptotics}\nThe sharp curves satisfy\n\\begin{equation}\n\\begin{aligned}\n\\delta(\\beta)&\\sim\\frac e8\\,\\beta e^{-2/\\beta}\n&&(\\beta\\downarrow0),&\n\\delta(\\beta)&\\sim\\frac1{4(1-\\beta)}\n&&(\\beta\\uparrow1),\\\\\n\\rho(\\kappa)&\\sim\\frac2{\\log(1/\\kappa)}\n&&(\\kappa\\downarrow0),&\n1-\\rho(\\kappa)&\\sim\\frac1{\\sqrt\\kappa}\n&&(\\kappa\\to\\infty).\n\\end{aligned}\n\\label{eq:55}\n\\end{equation}\n\\end{corollaryB}"
