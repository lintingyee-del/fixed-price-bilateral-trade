[nodes.T_calibration]
fingerprint = "sha256:4720a4ced6ac"
kind = "theorem"
statement = "\\begin{theoremC}[Global bound and maximizing control]\\label{thm:calibration}\nLet \\(d>0\\), let \\(h:[0,1]\\to[0,1]\\) be measurable, and let \\(C_d\\in(1/4,1/2)\\) satisfy \\(\\tau(C_d)=d\\). Set \\(x=(d+\\int_0^1h(t)\\,\\mathrm dt)^{-1}\\). For \\(x<1/d\\), let \\(C\\in(0,\\bar C(d))\\) be the unique solution of \\(D_C(Y_d(C))=(1+x)^{-1}\\); for \\(x=1/d\\), set \\(C=0\\) and \\(P_x\\equiv1/d\\). With the reciprocal state \\(p\\), reference curve \\(P_x\\), and logarithmic difference \\(v\\) from \\eqref{eq:11}, \\eqref{eq:16}, and \\eqref{eq:23}, respectively,\n\\begin{equation}\n\\begin{aligned}\nS(C_d)-\\mathcal J_d(h)\n={}&\\int_{\\min\\{C,C_d\\}}^{\\max\\{C,C_d\\}}\n\\frac{(Y_d(u)+U_d(u))|\\mathcal B_d(u)|}\n{(1-uY_d(u))^2}\\,\\mathrm du\\\\\n&+\\int_0^\\infty\n\\left[\na(v')^2+\\frac{e^{-2v}-1+2v}{P_x^2}-2Q_xv\n\\right]\\,\\mathrm da\n\\ \\ge0,\n\\end{aligned}\n\\tag{G}\\label{eq:29}\n\\end{equation}\nConsequently,\n\\begin{equation}\n\\max_{0\\le h\\le1}\\mathcal J_d(h)=S(C_d).\n\\label{eq:30}\n\\end{equation}\nThe maximizing control is unique up to equality almost everywhere. It has a zero arc of length \\(C_d\\), a strictly increasing arc of length \\((1-2C_d)/(1-C_d)\\), and a one arc of length \\(C_d^2/(1-C_d)\\). On the middle arc,\n\\begin{equation}\nt=C_d(1+y),\\qquad\ng(t)=d\\sqrt{D_{C_d}(y)}\\,e^{\\mathcal I_{C_d}(y)/2},\\qquad\nh(t)=\\frac{y\\,g(t)}{D_{C_d}(y)},\\qquad 0\\le y\\le y_e(C_d).\n\\label{eq:31}\n\\end{equation}\n\\end{theoremC}"
depends_on = ["P_preliminaries", "P_energy", "P_reference", "P_gaps"]
verified = ["rethlas"]
notes = "Rethlas\\verification\\results\\fixed_price_tex_20260921_revision1_T_calibration_attempt1\\verification.json; Independent LLM proof audit of the copied current TeX, not formal verification. Verifier /root/tex_proof_verifier; source commit a000a119e95e4f8c9f2d7a18f24cfb6b95416448; source location paper.tex thm:calibration; analytic premises ['P_preliminaries', 'P_energy', 'P_reference', 'P_gaps']. Previous record: Rethlas\\verification\\results\\fpm_20260913_T_calibration\\verification.json; verifier /root/audit_calibration; Independent LLM proof audit, not formal verification. Agent /root/audit_calibration; manuscript sha256 46124c72f1f3d71deaebfd4e5e22cc87e76c5638ac963c074675bee90fa8b42c; blueprint sha256 e6005ca3eb369692162a828e9ae063617b1852796d33d81e664b300ed821e4c4; premise set ['P_preliminaries', 'P_energy', 'P_reference', 'P_gaps']. Pass artifact: Rethlas\\reasoning\\results\\fixed_price_manuscript_20260913\\T_calibration\\blueprint_verified.md. Pass artifact: Rethlas\\reasoning\\results\\fixed_price_tex_20260921_revision1\\T_calibration\\blueprint_verified.md."
