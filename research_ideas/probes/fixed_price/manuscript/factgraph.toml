[nodes.A_model]
kind = "assumption"
statement = "Independent nonnegative buyer/seller values, finite positive expected first-best welfare, full prior information, inclusive deterministic fixed prices."

[nodes.P_preliminaries]
fingerprint = "sha256:13e113c0ea7a"
kind = "proposition"
statement = "For the model and scalar functions defined below, the maximum price GFT exists and randomizing prices cannot improve it. The scalar integral has the stated principal-arctangent expression, derivative identities (eq:7), strict monotonicity and endpoint limits (eq:8). Thus d(C) maps (1/4,1/2) bijectively to (0,infinity), and S(C) maps it bijectively to (1,infinity).\n\\begin{equation}\n\\mathcal I(C)=\\frac1\\omega\n\\left[\n\\arctan\\frac{1-3C}{2(1-C)\\omega}\n+\\arctan\\frac1{2\\omega}\n\\right].\n\\label{eq:5}\n\\end{equation}\n\\begin{equation}\n\\mathcal I'=-\\frac{2(C\\mathcal I+2)}{C(4C-1)},\\qquad\nS'=\\frac{(2C-1)\\mathcal I+8C-6}{4C-1}<0,\\qquad\n\\frac{d'}d=\\frac{S'}{2C-1}>0.\n\\label{eq:7}\n\\end{equation}\n\\begin{equation}\n(S(C),d(C))\\longrightarrow(\\infty,0)\\quad(C\\downarrow1/4),\n\\qquad\n(S(C),d(C))\\longrightarrow(1,\\infty)\\quad(C\\uparrow1/2).\n\\label{eq:8}\n\\end{equation}\nHere omega=sqrt(C-1/4), and C_d denotes the unique C in (1/4,1/2) satisfying d(C)=d."
depends_on = ["A_model"]
verified = ["rethlas"]
notes = "Rethlas\\verification\\results\\fpm_20260913_P_preliminaries\\verification.json; verifier /root/audit_preliminaries; Independent LLM proof audit, not formal verification. Agent /root/audit_preliminaries; manuscript sha256 46124c72f1f3d71deaebfd4e5e22cc87e76c5638ac963c074675bee90fa8b42c; blueprint sha256 952515cb317e1b9148afd7ba7b787b196f3cccc2075ce5fc355b62f8939bb734; premise set ['A_model']. Pass artifact: Rethlas\\reasoning\\results\\fixed_price_manuscript_20260913\\P_preliminaries\\blueprint_verified.md."

[nodes.P_energy]
fingerprint = "sha256:7c4936100115"
kind = "proposition"
statement = "\\begin{lemma}[energy representation]\\label{lem:energy}\nFor every \\(d>0\\), a measurable \\(h:[0,1]\\to[0,1]\\) induces through \\eqref{eq:11} an absolutely continuous \\(p\\) with\n\\begin{equation}\np'(A(t))=h(t)\\quad\\text{a.e.},\\qquad\np(a)\\le \\min\\{x+a,1/d\\},\\qquad\n\\frac1{d+1}\\le x\\le\\frac1d,\n\\label{eq:12}\n\\end{equation}\nand satisfies\n\\begin{equation}\n\\mathcal J_d(h)-1=\\mathcal F_d[p]\n:=-\\log(dx)+\\int_0^\\infty\n\\left[d^2-p^{-2}-a((\\log p)')^2\\right]\\,\\mathrm da.\n\\tag{E}\\label{eq:13}\n\\end{equation}\n\\end{lemma}\nAlso audit the Euler first integral and its power-equation consequence displayed immediately after the proof."
