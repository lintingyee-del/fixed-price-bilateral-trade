[nodes.P_two_finite_nodes]
fingerprint = "sha256:badb9954a0fc"
kind = "lemma"
statement = "\\label{app:two-recurrence}\n\nSuppose the buyers are supported on nodes\n\\(0=v_0<\\cdots<v_n=\\bar b\\).\nWrite \\(p_{i\\ell}=\\Pr(Z_i=v_\\ell)\\),\n\\(\\bar L_{ij}=\\bar L_i(v_j)\\), and\n\\(\\vartheta_j=\\vartheta(v_j)\\).\nFor prescribed nondecreasing node compensations, the least solution\nof the node inequalities is obtained backwards:\n\\begin{equation}\\label{eq:two-backward}\n\\begin{aligned}\n\\varpi_n&=\\max\\{0,1-d\\bar b-\\vartheta_n,1-d\\bar b+\\vartheta_n\\},\\\\\n\\varpi_j&=\\max\\left\\{\\varpi_{j+1},\\\n \\max_{i=1,2}\\left[\n  1-\\frac{dv_j}{\\bar L_{ij}}+\\frac{\\epsilon_i\\vartheta_j}{\\bar L_{ij}}\n  +\\sum_{\\ell>j}\n     \\frac{(v_\\ell-v_j)p_{i\\ell}}{\\bar L_{ij}}\\varpi_\\ell\n \\right]\\right\\}.\n\\end{aligned}\n\\end{equation}\nThe value is piecewise affine and convex in\n\\((d,\\vartheta_0,\\ldots,\\vartheta_n)\\).\nThe price at \\(v_j\\) has normalized mass\n\\(\\varpi_{j-1}-\\varpi_j\\).\n\nFor a pricing certificate, the node solution must also cover the\nintervals between nodes. At the relevant budget\n\\(\\varpi_0\\le1+d\\), this follows from the gain kernel.\nBetween price events,\n\\[\n(\\psi_i^\\varpi)'(s)\n=d+H_i(s)-\\int_{(s,\\bar b]}\\Pr(Z_i\\ge z)\\,\n                              \\widehat\\pi_0(\\mathrm dz)\n\\ge d-H_i(s)(\\varpi_0-1)\\ge0.\n\\]\nAt an event, the potential drops by the price atom's mass times\n\\(\\bar L_i(s)\\). Its minimum on each interval is therefore its\nright trace at the preceding event, and ordered node constraints\ncover all ordered real seller values. At arbitrary budgets,\n\\eqref{eq:two-backward} is only a node optimization;\nthe full interval problem is \\eqref{eq:two-operator}."
